<!DOCTYPE html>
<!-- Source for assets/card.png (1200x630 Open Graph card). Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
       --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
       --window-size=1200,630 --screenshot=assets/card.png assets/card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Newsreader:opsz,wght@6..72,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1200px; height:630px; overflow:hidden; }
  body{
    background:#0C1013; color:#E7EBE9;
    font-family:"Newsreader",Georgia,serif;
    display:grid; grid-template-columns:497px 1fr; align-items:center;
    gap:44px; padding:56px 56px 56px 64px;
  }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace; font-size:15px; font-weight:600;
    letter-spacing:.19em; text-transform:uppercase; color:#7C878D;
  }
  h1{
    font-family:"Space Grotesk",system-ui,sans-serif; font-weight:700;
    font-size:92px; line-height:.92; letter-spacing:-.035em;
    margin:18px 0 0; color:#fff;
  }
  .claim{ font-size:29px; line-height:1.29; margin:22px 0 0; color:#EDF0F1; }
  .claim b{ color:#FF6A5C; font-weight:400; }
  .authors{
    font-family:"IBM Plex Mono",monospace; font-size:14.5px; letter-spacing:.05em;
    color:#7C878D; margin:26px 0 0;
  }
  .plate{
    background:#fff; border-radius:5px; padding:16px 16px 8px;
    box-shadow:0 22px 60px rgba(0,0,0,.55);
  }
  .plate img{ display:block; width:100%; height:auto; }
  .plate .lbl{
    font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.045em;
    color:#5A646A; padding:9px 3px 3px; line-height:1.5;
  }
</style>
</head>
<body>
  <div>
    <p class="eyebrow">arXiv:2607.20723</p>
    <h1>LeakyLMs</h1>
    <p class="claim">Streaming an LLM's tokens one at a time leaks
      <b>the shape of the machine producing them.</b></p>
    <p class="authors">MAJIDI &middot; MIRESHGHALLAH &middot; TARAM<br>PURDUE &middot; CMU</p>
  </div>
  <div class="plate">
    <img src="figures/gemini-flash-2.5_context_plot_nth_breakpoint.svg" alt="">
    <p class="lbl">GEMINI FLASH 2.5 &mdash; A DRAFT MODEL RUNNING OUT OF CONTEXT AT 131,059 TOKENS.</p>
  </div>
</body>
</html>
